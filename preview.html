<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DroneWatch Operator Preview</title>
<style>
:root{
  --bg:#0b1016; --panel:#0f161e; --panel-2:#131c26; --line:#1c2833; --line-2:#26343f;
  --ink:#dbe4ec; --ink-dim:#8d9caa; --ink-faint:#5c6b78;
  --high:#ff5d5d; --watch:#f2b53a; --low:#49c9d9; --site:#6fb3ff; --select:#ffffff;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 8px}
.app{display:grid;grid-template-rows:50px minmax(0,1fr) 50px;height:100vh}

/* top bar */
.top{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.2px}
.brand .mark{width:16px;height:16px;border:2px solid var(--site);border-radius:50%;position:relative}
.brand .mark::after{content:"";position:absolute;inset:4px;background:var(--site);border-radius:50%}
.sim{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--watch);border:1px solid #5a4416;background:#20190a;padding:6px 9px;border-radius:3px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg button{padding:5px 12px;font:600 13px var(--mono);color:var(--ink-dim);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#1a2a3a;color:#fff}
.spacer{flex:1}
.viso{display:flex;align-items:center;gap:7px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--ink-dim);padding:6px 9px;border:1px solid var(--line-2);border-radius:3px}
.viso .dot{width:8px;height:8px;border-radius:50%;background:#48545f}
.viso.ok .dot{background:#4ad27a}.viso.warn .dot{background:var(--watch)}.viso.bad .dot{background:var(--high)}
.diag{font-size:12px;color:var(--ink-faint);text-decoration:none}
.diag:hover{color:var(--ink-dim)}
.lbl{font-size:12px;color:var(--ink-faint)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.map{position:relative;min-height:0;background:var(--bg);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.summary{position:absolute;left:14px;top:12px;font:12px/1.45 var(--mono);color:var(--ink-dim);background:#0b1016cc;border:1px solid var(--line);padding:9px 11px;border-radius:4px;min-width:150px;pointer-events:none}
.summary .h{color:var(--ink);font-weight:700;letter-spacing:.08em;font-size:11px}
.summary .n{color:#fff;font-size:20px;font-weight:700;line-height:1.1;margin:3px 0 6px}
.summary .row{display:flex;justify-content:space-between;gap:12px}
.summary .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.viewctl{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:6px}
.viewctl button{width:34px;height:30px;background:#0f161ecc;border:1px solid var(--line-2);border-radius:4px;color:var(--ink);font:600 15px var(--mono)}
.viewctl button.wide{width:auto;padding:0 10px;font:600 11px var(--mono);letter-spacing:.06em}
.viewctl button[aria-pressed="true"]{background:#1a2a3a;border-color:#2f4a63}
.scale{position:absolute;left:14px;bottom:12px;font:11px var(--mono);color:var(--ink-dim);pointer-events:none}
.scale .bar{height:2px;background:var(--ink-dim);margin-bottom:4px;position:relative}
.scale .bar::before,.scale .bar::after{content:"";position:absolute;bottom:0;width:1px;height:7px;background:var(--ink-dim)}
.scale .bar::after{right:0}
.north{position:absolute;right:16px;bottom:12px;font:600 11px var(--mono);color:var(--ink-faint);text-align:center;pointer-events:none}
.north svg{display:block;width:16px;height:22px;margin:0 auto 2px;position:static}
.mode{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink-dim);background:#0b1016cc;border:1px solid var(--line);padding:5px 10px;border-radius:3px;pointer-events:none}
.mode[hidden]{display:none}

/* rail */
.rail{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.rail-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;font:700 11px var(--mono);letter-spacing:.1em;color:var(--ink-dim)}
.rail-h .c{font-weight:400;color:var(--ink-faint);letter-spacing:0}
.rows{flex:0 1 auto;overflow-y:auto;min-height:0;max-height:52%}
.row{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#121b25}
.row[aria-selected="true"]{background:#152230;border-left-color:var(--select)}
.row .id{font:700 13.5px var(--mono);color:#fff}
.row .pr{font:700 10.5px var(--mono);letter-spacing:.08em;text-align:right;align-self:center}
.row .rg{font:12.5px var(--mono);color:var(--ink-dim)}
.row .mv{font:11px var(--mono);letter-spacing:.06em;color:var(--ink-faint);text-align:right}
.row .id .st{font-weight:400;font-size:10px;color:var(--ink-faint);margin-left:6px;letter-spacing:.06em}
.p-high{color:var(--high)}.p-watch{color:var(--watch)}.p-low{color:var(--low)}
.card{flex:1 1 auto;min-height:0;overflow-y:auto;border-top:1px solid var(--line-2);padding:12px 14px 14px}
.card .empty{color:var(--ink-faint);font-size:13px;padding:18px 0;text-align:center}
.card .top{display:flex;align-items:center;gap:10px;padding:0;border:0;background:none;height:auto}
.card .cid{font:700 20px var(--mono);color:#fff}
.badge{font:700 10px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:3px;border:1px solid}
.badge.p-high{background:#2a1416;border-color:#5a2426}.badge.p-watch{background:#2a2110;border-color:#5a4416}.badge.p-low{background:#0f272c;border-color:#1f4a52}
.reason{color:var(--ink-dim);font-size:13px;margin:6px 0 12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f .k{font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink-faint)}
.f .v{font:600 15px var(--mono);color:var(--ink);margin-top:2px}
.f .v small{font-weight:400;font-size:11px;color:var(--ink-faint);margin-left:3px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px}
.acts button{padding:9px 0;border:1px solid var(--line-2);border-radius:4px;background:var(--panel-2);font:700 11.5px var(--mono);letter-spacing:.1em}
.acts button[aria-pressed="true"]{background:#1f3448;border-color:#3a5b7a;color:#fff}
details{color:var(--ink-faint);font-size:12px}
details summary{cursor:pointer;list-style:none;padding:6px 0}
details summary::before{content:"▸ ";font-size:10px}
details[open] summary::before{content:"▾ "}
details .kv{font:11.5px/1.6 var(--mono);color:var(--ink-dim);white-space:pre-wrap}

/* transport */
.bot{display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);background:var(--panel)}
.bot button{padding:6px 14px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel-2)}
.bot button.primary{background:#1a3a5a;border-color:#2b5a85;color:#fff}
.bot button:disabled{opacity:.4;cursor:default}
.clock{font:600 13.5px var(--mono);color:var(--ink);margin-left:8px}
.clock .of{color:var(--ink-faint);font-weight:400}

/* drawer */
.drawer{position:fixed;top:50px;right:0;width:380px;bottom:50px;background:var(--panel);border-left:1px solid var(--line-2);padding:16px 18px;overflow:auto;z-index:5;box-shadow:-12px 0 30px #0008}
.drawer[hidden]{display:none}
.drawer h3{margin:0 0 6px;font:700 12px var(--mono);letter-spacing:.1em;color:var(--ink-dim)}
.drawer .x{position:absolute;right:12px;top:10px;color:var(--ink-dim);font-size:18px}
.drawer p{color:var(--ink-dim);font-size:13px}
.drawer .kv{font:12px/1.7 var(--mono);color:var(--ink);white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);padding:10px;border-radius:4px}
.pill{display:inline-block;font:700 10px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:3px;border:1px solid var(--line-2);color:var(--ink-dim)}

@media (max-width:1500px){
  .main{grid-template-columns:minmax(0,1fr) 300px}
  .row{padding:7px 12px}
  .card{padding:10px 12px 12px}
  .f .v{font-size:14px}
  .card .cid{font-size:18px}
}
@media (max-height:820px){
  .app{grid-template-rows:46px minmax(0,1fr) 46px}
  .drawer{top:46px;bottom:46px}
  .rows{max-height:50%}
  .row{padding:6px 12px}
  .rail-h{padding:9px 12px 6px}
  .facts{gap:8px 10px}
  .acts{margin:10px 0 8px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span>DroneWatch</div>
    <span class="sim">SIMULATION — NOT LIVE</span>
    <select id="scenario" aria-label="Scenario">
      <option value="operator_demo">Incoming group</option>
      <option value="operator_demo_signal_loss">Incoming group + contact loss</option>
    </select>
    <div class="seg" id="count-seg" role="group" aria-label="Contact count">
      <button data-n="3">3</button><button data-n="6" aria-pressed="true">6</button><button data-n="10">10</button>
    </div>
    <span class="spacer"></span>
    <button class="viso" id="viso-btn" title="Viso Now connection"><span class="dot" id="viso-dot"></span><span id="viso-text">VISO</span></button>
    <a class="diag" href="/preview/diagnostics">Diagnostics</a>
  </header>

  <div class="main">
    <section class="map" id="map">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" aria-label="Tactical picture"></svg>
      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="mode" id="mode" hidden>FOCUS</div>
      <div class="viewctl">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="v-overview" class="wide" title="Operator framing">OVERVIEW</button>
      </div>
      <div class="scale"><div class="bar" id="scale-bar" style="width:90px"></div><span id="scale-text">500 m</span></div>
      <div class="north"><svg viewBox="0 0 16 22"><path d="M8 1 L13 14 L8 11 L3 14 Z" fill="#8d9caa"/></svg>N</div>
    </section>

    <aside class="rail">
      <div class="rail-h"><span>CONTACTS</span><span class="c" id="contact-count">loading…</span></div>
      <div class="rows" id="rows"></div>
      <div class="card" id="card"><div class="empty">Select a contact on the map or in the list.</div></div>
    </aside>
  </div>

  <footer class="bot">
    <button id="play" class="primary">Play</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
    <span class="lbl">Speed</span>
    <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    <span class="clock" id="clock">T+00.0 <span class="of">/ 90 s</span></span>
  </footer>
</div>

<div class="drawer" id="connections" hidden>
  <button class="x" id="close-connections" aria-label="Close">×</button>
  <h3>VISO NOW</h3>
  <p>Visual-evidence source. Synthetic playback never changes this status; only genuine webhook deliveries do.</p>
  <p><span class="pill" id="viso-pill">—</span></p>
  <div class="kv" id="viso-kv">Loading…</div>
</div>

<script id="operator-core">
// Pure display logic: no DOM, no network. Extracted by tests/operator.test.cjs.
const OP=(()=>{
  const PRIORITY_RANK={'HIGH PRIORITY':0,'WATCH':1,'LOW PRIORITY':2};
  const MIN_SCALE=0.008, MAX_SCALE=2.2;   // screen pixels per simulation metre
  const clampScale=s=>Math.min(MAX_SCALE,Math.max(MIN_SCALE,s));

  // One projection for the whole scene. Simulation y grows north, screen y
  // grows downward, so y is inverted exactly here and nowhere else.
  function project(camera,viewport){
    const {cx,cy,scale}=camera, {w,h}=viewport;
    return {
      toScreen:(x,y)=>({px:(x-cx)*scale+w/2, py:h/2-(y-cy)*scale}),
      toWorld:(px,py)=>({x:(px-w/2)/scale+cx, y:(h/2-py)/scale+cy})
    };
  }

  function fitCamera(points,viewport,pad){
    if(!points||!points.length) return null;
    const margin=typeof pad==='number'?pad:0.18;
    const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const spanX=Math.max(maxX-minX,120), spanY=Math.max(maxY-minY,120);
    const scale=clampScale(Math.min(viewport.w/(spanX*(1+margin*2)),viewport.h/(spanY*(1+margin*2))));
    return {cx:(minX+maxX)/2, cy:(minY+maxY)/2, scale};
  }

  function scenarioEnvelope(frames,site){
    const points=[];
    if(site){
      const r=(site.radius_m||600)*1.25;
      points.push({x:site.x-r,y:site.y-r},{x:site.x+r,y:site.y+r});
    }
    const list=frames||[];
    const stride=Math.max(1,Math.floor(list.length/60));
    for(let i=0;i<list.length;i+=stride) for(const t of list[i].tracks) points.push({x:t.x,y:t.y});
    return points;
  }

  // The operator camera. Not a generic fit: the protected area is always whole
  // and sits lower-centre, the group sits above it, and the corridor between
  // them is what the screen is about. Scale is the tightest of three limits:
  // the group must clear the top, the boundary must clear the bottom, and the
  // whole thing must fit the width.
  const SITE_ANCHOR=0.70;         // site's screen y as a fraction of height
  function operatorCamera(tracks,site,viewport){
    if(!site) return null;
    const r=site.radius_m||600, {w,h}=viewport, m=Math.max(34,h*0.05);
    const live=(tracks||[]).filter(t=>Number.isFinite(t.x)&&Number.isFinite(t.y));
    const xs=[site.x-r,site.x+r,...live.map(t=>t.x)];
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const topY=Math.max(site.y+r, ...live.map(t=>t.y));
    const byWidth=(w-2*m)/Math.max(maxX-minX,2*r);
    const byTop=(SITE_ANCHOR*h-m)/Math.max(topY-site.y,r);
    const byBottom=((1-SITE_ANCHOR)*h-m)/r;
    const scale=clampScale(Math.min(byWidth,byTop,byBottom,0.6));
    return {cx:(minX+maxX)/2, cy:site.y+(SITE_ANCHOR-0.5)*h/scale, scale};
  }

  // Focus: close enough to inspect the contact, but the site stays on screen
  // whenever the geometry allows it, so "where is this relative to the site"
  // is never lost.
  function focusCamera(track,site,viewport){
    if(!track) return null;
    if(!site) return {cx:track.x,cy:track.y,scale:0.45};
    // Centre 60% of the way from the site to the contact, and cap the zoom so
    // the site stays inside the frame while the contact is within ~2.5 km.
    // Beyond that, inspecting the contact wins and the site leaves the frame.
    const d=Math.hypot(track.x-site.x,track.y-site.y);
    const room=Math.min(viewport.w,viewport.h)/2-70;
    const keepSite=room/Math.max(0.6*d,1);
    return {cx:track.x*0.6+site.x*0.4, cy:track.y*0.6+site.y*0.4,
            scale:clampScale(Math.min(0.6,Math.max(0.25,keepSite)))};
  }

  function stepCamera(camera,target,dt){
    if(!target) return camera;
    const k=1-Math.exp(-6*Math.max(0,dt));
    return {cx:camera.cx+(target.cx-camera.cx)*k, cy:camera.cy+(target.cy-camera.cy)*k,
            scale:clampScale(camera.scale+(target.scale-camera.scale)*k)};
  }

  function zoomAt(camera,factor,px,py,viewport){
    const before=project(camera,viewport).toWorld(px,py);
    const scale=clampScale(camera.scale*factor);
    const moved={...camera,scale};
    const after=project(moved,viewport).toWorld(px,py);
    return {cx:moved.cx+(before.x-after.x), cy:moved.cy+(before.y-after.y), scale};
  }

  function niceScale(scale,maxPixels){
    const steps=[10,20,50,100,200,500,1000,2000,5000];
    const limit=(maxPixels||120)/scale;
    let chosen=steps[0];
    for(const step of steps) if(step<=limit) chosen=step;
    return {metres:chosen,pixels:chosen*scale};
  }

  function sortTracks(tracks){
    return [...(tracks||[])].sort((a,b)=>{
      const pa=PRIORITY_RANK[a.priority]??9, pb=PRIORITY_RANK[b.priority]??9;
      if(pa!==pb) return pa-pb;
      if(a.range_m!==b.range_m) return a.range_m-b.range_m;
      return a.id<b.id?-1:a.id>b.id?1:0;
    });
  }

  function resolveSelection(selectedId,tracks){
    if(!selectedId) return null;
    return (tracks||[]).find(t=>t.id===selectedId)||null;
  }

  // Simple vertical nudge; kept for callers that only need that.
  function declutter(labels,minGapY,minGapX){
    const gapY=minGapY||18, gapX=minGapX||64;
    const placed=[];
    for(const label of [...labels].sort((a,b)=>a.py-b.py)){
      let py=label.py;
      for(const other of placed){
        if(Math.abs(other.px-label.px)<gapX && Math.abs(other.py-py)<gapY) py=other.py+gapY;
      }
      placed.push({...label,py});
    }
    return placed;
  }

  // Real label placement. Each label tries a ring of anchor positions around
  // its symbol and takes the first that overlaps neither an already-placed
  // label nor any symbol. Symbols never move, so the map stays truthful; only
  // the text finds room. Returns {id, x, y, w, h, anchor} in screen space.
  const OFFSETS=[[14,-6],[14,8],[-14,-6],[-14,8],[0,-22],[0,20],[22,-16],[-22,-16],[22,16],[-22,16],[0,-38],[0,36]];
  function placeLabels(items,opts){
    const o=Object.assign({w:52,h:26,symbol:22,gap:3},opts||{});
    const boxes=[];
    for(const it of items) boxes.push({x:it.px-o.symbol/2,y:it.py-o.symbol/2,w:o.symbol,h:o.symbol,sym:true});
    const hit=(a,b)=>!(a.x+a.w+o.gap<b.x||b.x+b.w+o.gap<a.x||a.y+a.h+o.gap<b.y||b.y+b.h+o.gap<a.y);
    const out=[];
    const order=[...items].sort((a,b)=>(b.rank||0)-(a.rank||0)||a.py-b.py);
    for(const it of order){
      const w=it.w||o.w, h=it.h||o.h;
      let chosen=null;
      for(const [dx,dy] of OFFSETS){
        const anchor=dx>0?'start':dx<0?'end':'middle';
        const x=dx>0?it.px+dx:dx<0?it.px+dx-w:it.px-w/2;
        const y=it.py+dy-h/2;
        const box={x,y,w,h};
        if(!boxes.some(b=>hit(box,b))){chosen={x,y,w,h,anchor,dx,dy};break}
      }
      if(!chosen){const x=it.px+14,y=it.py-6-h/2;chosen={x,y,w,h,anchor:'start',dx:14,dy:-6}}
      boxes.push(chosen);
      out.push({id:it.id,...chosen});
    }
    return out;
  }

  function priorityClass(priority){
    return priority==='HIGH PRIORITY'?'p-high':priority==='WATCH'?'p-watch':'p-low';
  }

  // Positive when the contact is moving toward the site.
  function closingSpeed(track,site){
    const h=(track.heading||0)*Math.PI/180, s=track.speed||0;
    const vx=s*Math.cos(h), vy=s*Math.sin(h);
    const dx=track.x-site.x, dy=track.y-site.y, d=Math.hypot(dx,dy);
    if(d<1e-6) return 0;
    return -(dx*vx+dy*vy)/d;
  }

  function createPlayback(frames){
    const list=frames||[];
    let index=0, playing=false;
    return {
      get total(){return list.length},
      get index(){return index},
      get playing(){return playing},
      get done(){return list.length>0&&index>=list.length-1},
      frame(){return list[Math.min(index,list.length-1)]||null},
      play(){ if(list.length&&index<list.length-1) playing=true; return playing },
      pause(){ playing=false; return playing },
      step(n){
        const by=Number.isFinite(n)&&n>=1?Math.floor(n):1;
        index=Math.min(Math.max(0,list.length-1),index+by);
        if(index>=list.length-1) playing=false;
        return index;
      },
      seek(i){ index=Math.min(Math.max(0,list.length-1),Math.max(0,Math.floor(i))); return index },
      reset(){ index=0; playing=false; return index }
    };
  }

  return {project,fitCamera,scenarioEnvelope,operatorCamera,focusCamera,stepCamera,zoomAt,niceScale,
          sortTracks,resolveSelection,declutter,placeLabels,priorityClass,closingSpeed,createPlayback,
          PRIORITY_RANK,MIN_SCALE,MAX_SCALE,SITE_ANCHOR};
})();
if(typeof module!=='undefined') module.exports=OP;
</script>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const NS='http://www.w3.org/2000/svg';
  const COLOR={'HIGH PRIORITY':'#ff5d5d','WATCH':'#f2b53a','LOW PRIORITY':'#49c9d9'};
  const SHORT={'HIGH PRIORITY':'HIGH','WATCH':'WATCH','LOW PRIORITY':'LOW'};

  const state={
    data:null, playback:OP.createPlayback([]), site:{x:0,y:0,radius_m:600},
    camera:{cx:0,cy:900,scale:0.2}, target:null, viewport:{w:1200,h:800},
    mode:'operator',            // operator | focus | follow | manual
    selectedId:null, timer:null, lastRaf:0, lastFrame:-1,
    count:6, scenario:'operator_demo', seed:42, drag:null,
  };
  window.OPSTATE=state;

  /* ---------------- data ---------------- */
  async function load(){
    stop();
    state.playback=OP.createPlayback([]); state.lastFrame=-1;
    $('contact-count').textContent='loading…';
    $('rows').innerHTML=''; renderCard();
    const url=`/api/preview/tracks?name=${encodeURIComponent(state.scenario)}&seed=${state.seed}&count=${state.count}`;
    let data;
    try{ const r=await fetch(url); if(!r.ok) throw new Error(r.status); data=await r.json(); }
    catch(e){ $('contact-count').textContent='load failed'; return; }
    state.data=data; state.site=data.site||state.site;
    state.playback=OP.createPlayback(data.frames||[]);
    resizeViewport();
    state.mode='operator'; state.target=null;
    state.camera=OP.operatorCamera(firstPopulatedFrame().tracks,state.site,state.viewport)||state.camera;
    $('clock').innerHTML=`T+00.0 <span class="of">/ ${Math.round(data.duration_s||90)} s</span>`;
    render();
  }
  function firstPopulatedFrame(){
    const f=state.data.frames.find(f=>f.tracks.length)||state.data.frames[0]||{tracks:[]};
    return f;
  }

  /* ---------------- playback ---------------- */
  function start(){
    if(!state.playback.play()) return;
    const hz=state.data.frame_hz||5, speed=parseFloat($('speed').value)||1;
    clearInterval(state.timer);
    state.timer=setInterval(()=>{
      state.playback.step(1);
      if(!state.playback.playing) stop();
      render();
    },1000/(hz*speed));
    syncTransport();
  }
  function stop(){ clearInterval(state.timer); state.timer=null; state.playback.pause(); syncTransport(); }
  function reset(){ stop(); state.playback.reset(); state.lastFrame=-1; overview(); render(); }

  /* ---------------- camera ---------------- */
  function resizeViewport(){
    const r=$('stage').getBoundingClientRect();
    state.viewport={w:Math.max(320,r.width),h:Math.max(240,r.height)};
  }
  function currentTracks(){ const f=state.playback.frame(); return f?f.tracks:[]; }

  function overview(){ state.mode='operator'; state.target=null; $('mode').hidden=true; syncViewButtons(); }
  function focusSelected(follow){
    const t=OP.resolveSelection(state.selectedId,currentTracks());
    if(!t) return;
    state.mode=follow?'follow':'focus';
    state.target=OP.focusCamera(t,state.site,state.viewport);
    $('mode').hidden=false; $('mode').textContent=follow?'FOLLOWING '+t.id:'FOCUS '+t.id;
    syncViewButtons();
  }
  function manual(){ if(state.mode!=='manual'){ state.mode='manual'; state.target=null; $('mode').hidden=false; $('mode').textContent='MANUAL VIEW'; syncViewButtons(); } }
  function syncViewButtons(){
    $('v-overview').setAttribute('aria-pressed',String(state.mode==='operator'));
    renderCard();
  }

  // Operator framing re-targets only when the ideal has drifted materially,
  // so the camera reads as an occasional deliberate adjustment.
  function steerOperator(){
    const want=OP.operatorCamera(currentTracks(),state.site,state.viewport);
    if(!want) return;
    const ref=state.target||state.camera;
    const dScale=Math.abs(want.scale-ref.scale)/Math.max(ref.scale,1e-6);
    const span=Math.max(state.viewport.w,state.viewport.h)/Math.max(want.scale,1e-6);
    const dMove=Math.hypot(want.cx-ref.cx,want.cy-ref.cy)/span;
    if(dScale>0.12||dMove>0.07) state.target=want;
  }

  function tick(now){
    const dt=state.lastRaf?Math.min(0.1,(now-state.lastRaf)/1000):0.016;
    state.lastRaf=now;
    if(state.mode==='operator') steerOperator();
    if(state.mode==='follow'){
      const t=OP.resolveSelection(state.selectedId,currentTracks());
      if(t) state.target={cx:t.x,cy:t.y,scale:state.camera.scale};
    }
    if(state.target){
      state.camera=OP.stepCamera(state.camera,state.target,dt);
      const close=Math.abs(state.camera.cx-state.target.cx)<0.5&&Math.abs(state.camera.cy-state.target.cy)<0.5
        &&Math.abs(state.camera.scale-state.target.scale)<0.0003;
      if(close&&state.mode!=='follow') state.target=null;
      draw();
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- rendering ---------------- */
  function render(){ draw(); renderRows(); renderCard(); renderClock(); renderSummary(); syncTransport(); }

  const svg=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs) e.setAttribute(k,attrs[k]);return e};
  const fmtRange=m=>m>=1000?`${(m/1000).toFixed(2)} km`:`${Math.round(m)} m`;
  const compass=h=>Math.round((90-h+360)%360);

  function trailFor(id,span){
    const frames=state.data?state.data.frames:[], i=state.playback.index;
    const pts=[];
    for(let k=Math.max(0,i-span);k<=i;k+=2){
      const t=frames[k]&&frames[k].tracks.find(x=>x.id===id);
      if(t) pts.push(t);
    }
    return pts;
  }

  function draw(){
    const stage=$('stage'); resizeViewport();
    const {w,h}=state.viewport, P=OP.project(state.camera,state.viewport), sc=state.camera.scale;
    stage.replaceChildren();
    const tracks=currentTracks(), site=state.site;
    const s=P.toScreen(site.x,site.y);

    // grid
    const step=OP.niceScale(sc,170).metres;
    const g=svg('g',{stroke:'#141d27','stroke-width':1});
    const w0=P.toWorld(0,h), w1=P.toWorld(w,0);
    for(let x=Math.floor(w0.x/step)*step;x<=w1.x;x+=step){const p=P.toScreen(x,0).px;g.append(svg('line',{x1:p,y1:0,x2:p,y2:h}))}
    for(let y=Math.floor(w0.y/step)*step;y<=w1.y;y+=step){const p=P.toScreen(0,y).py;g.append(svg('line',{x1:0,y1:p,x2:w,y2:p}))}
    stage.append(g);

    // protected area
    const rp=site.radius_m*sc;
    stage.append(svg('circle',{cx:s.px,cy:s.py,r:rp,fill:'#6fb3ff0d',stroke:'#4d8bd0',
      'stroke-width':1.5,'stroke-dasharray':'6 5'}));
    const cap=svg('text',{x:s.px,y:s.py+rp+16,'text-anchor':'middle',fill:'#4d8bd0','font-size':10.5,
      'font-family':'var(--mono)','letter-spacing':'.1em'});
    cap.textContent=`MONITORED AREA · ${site.radius_m} m`; stage.append(cap);
    stage.append(svg('path',{d:`M ${s.px} ${s.py-8} L ${s.px+8} ${s.py} L ${s.px} ${s.py+8} L ${s.px-8} ${s.py} Z`,fill:'#6fb3ff',stroke:'#0b1016','stroke-width':1.5}));
    const st=svg('text',{x:s.px,y:s.py+22,'text-anchor':'middle',fill:'#9cc4ee','font-size':11,'font-weight':700,'font-family':'var(--mono)','letter-spacing':'.1em'});
    st.textContent='SITE ALPHA'; stage.append(st);

    // trails, vectors, symbols
    const selected=state.selectedId, focus=state.mode==='focus'||state.mode==='follow';
    const items=[];
    for(const t of tracks){
      const col=COLOR[t.priority]||'#9aa', isSel=t.id===selected, high=t.priority==='HIGH PRIORITY';
      const p=P.toScreen(t.x,t.y);
      const trail=trailFor(t.id,isSel?100:40);
      if(trail.length>1){
        const d=trail.map((q,i)=>{const z=P.toScreen(q.x,q.y);return `${i?'L':'M'} ${z.px.toFixed(1)} ${z.py.toFixed(1)}`}).join(' ');
        stage.append(svg('path',{d,fill:'none',stroke:col,'stroke-opacity':isSel?0.75:0.32,'stroke-width':isSel?2:1.2,'stroke-linecap':'round'}));
      }
      if(t.status!=='STALE'){
        const hr=(t.heading||0)*Math.PI/180;
        const len=Math.min(72,Math.max(16,(t.speed||0)*14*sc));
        const vx=p.px+Math.cos(hr)*len, vy=p.py-Math.sin(hr)*len;
        stage.append(svg('line',{x1:p.px,y1:p.py,x2:vx,y2:vy,stroke:col,'stroke-width':high?2.2:1.4,'stroke-opacity':high?0.95:0.7,'stroke-linecap':'round'}));
        if(high) stage.append(svg('path',{d:`M ${vx} ${vy} l -6 -3 l 0 6 z`,fill:col,transform:`rotate(${-(t.heading||0)} ${vx} ${vy})`}));
      }
      if(isSel&&focus){
        stage.append(svg('line',{x1:p.px,y1:p.py,x2:s.px,y2:s.py,stroke:'#ffffff','stroke-opacity':0.28,'stroke-width':1,'stroke-dasharray':'3 5'}));
      }
      if(isSel) stage.append(svg('circle',{cx:p.px,cy:p.py,r:16,fill:'none',stroke:'#fff','stroke-width':1.5,'stroke-opacity':0.9}));
      const sym=svg('path',{d:'M -12,-9 L 14,0 L -12,9 L -5,0 Z',
        fill:t.status==='STALE'?'none':col, stroke:col,'stroke-width':t.status==='STALE'?1.5:1,
        'stroke-dasharray':t.status==='COASTING'?'3 2':'none',
        transform:`translate(${p.px} ${p.py}) rotate(${-(t.heading||0)})`,'data-id':t.id,style:'cursor:pointer'});
      sym.addEventListener('click',ev=>{ev.stopPropagation();select(t.id)});
      stage.append(sym);
      items.push({id:t.id,px:p.px,py:p.py,rank:isSel?2:high?1:0,w:isSel?86:56,h:t.status==='STALE'?38:26,track:t,col});
    }

    // labels, decluttered
    for(const L of OP.placeLabels(items)){
      const it=items.find(i=>i.id===L.id), t=it.track;
      const x=L.anchor==='start'?L.x:L.anchor==='end'?L.x+L.w:L.x+L.w/2;
      const g=svg('g',{'font-family':'var(--mono)','pointer-events':'none'});
      const a=svg('text',{x,y:L.y+11,'text-anchor':L.anchor,fill:t.id===selected?'#fff':it.col,'font-size':11.5,'font-weight':700});
      a.textContent=t.id; g.append(a);
      const b=svg('text',{x,y:L.y+23,'text-anchor':L.anchor,fill:'#9aa9b6','font-size':10.5});
      b.textContent=fmtRange(t.range_m); g.append(b);
      if(t.status==='STALE'){const c=svg('text',{x,y:L.y+35,'text-anchor':L.anchor,fill:it.col,'font-size':9.5,'letter-spacing':'.08em'});c.textContent='LAST KNOWN';g.append(c)}
      stage.append(g);
    }

    // off-screen cues in focus/follow: where is the rest of the group
    if(focus){
      for(const it of items){
        if(it.px>=8&&it.px<=w-8&&it.py>=8&&it.py<=h-8) continue;
        const cx=w/2, cy=h/2, dx=it.px-cx, dy=it.py-cy;
        const k=Math.min((w/2-26)/Math.abs(dx||1e-6),(h/2-26)/Math.abs(dy||1e-6));
        const ex=cx+dx*k, ey=cy+dy*k, ang=Math.atan2(dy,dx)*180/Math.PI;
        stage.append(svg('path',{d:'M 0,-5 L 9,0 L 0,5 Z',fill:it.col,transform:`translate(${ex} ${ey}) rotate(${ang})`}));
        const tx=svg('text',{x:ex-Math.cos(ang*Math.PI/180)*14,y:ey-Math.sin(ang*Math.PI/180)*14+4,'text-anchor':'middle',fill:it.col,'font-size':10,'font-family':'var(--mono)'});
        tx.textContent=it.id.replace('DW-',''); stage.append(tx);
      }
    }

    const nice=OP.niceScale(sc,140);
    $('scale-bar').style.width=`${Math.max(24,nice.pixels).toFixed(0)}px`;
    $('scale-text').textContent=nice.metres>=1000?`${nice.metres/1000} km`:`${nice.metres} m`;
  }

  function renderSummary(){
    const tracks=currentTracks();
    const n={h:0,w:0,l:0};
    for(const t of tracks){ if(t.priority==='HIGH PRIORITY') n.h++; else if(t.priority==='WATCH') n.w++; else n.l++; }
    $('summary').innerHTML=`<div class="h">INCOMING GROUP</div><div class="n">${tracks.length} TRACK${tracks.length===1?'':'S'}</div>
      <div class="row"><span><i class="k" style="background:var(--high)"></i>HIGH</span><span>${n.h}</span></div>
      <div class="row"><span><i class="k" style="background:var(--watch)"></i>WATCH</span><span>${n.w}</span></div>
      <div class="row"><span><i class="k" style="background:var(--low)"></i>LOW</span><span>${n.l}</span></div>`;
  }

  function renderRows(){
    const tracks=OP.sortTracks(currentTracks());
    $('contact-count').textContent=tracks.length?`${tracks.length} tracked`:'none yet';
    const rows=$('rows'); rows.replaceChildren();
    for(const t of tracks){
      const c=OP.closingSpeed(t,state.site);
      const mv=t.status==='STALE'?'LAST KNOWN':c>2?'CLOSING':c<-2?'OPENING':'HOLDING';
      const el=document.createElement('div'); el.className='row'; el.setAttribute('role','button');
      el.setAttribute('aria-selected',String(t.id===state.selectedId));
      el.innerHTML=`<div class="id">${t.id}${t.status!=='TRACKING'?`<span class="st">${t.status}</span>`:''}</div>
        <div class="pr ${OP.priorityClass(t.priority)}">${SHORT[t.priority]||t.priority}</div>
        <div class="rg">${fmtRange(t.range_m)}</div><div class="mv">${mv}</div>`;
      el.addEventListener('click',()=>select(t.id));
      rows.append(el);
    }
  }

  function renderCard(){
    const card=$('card');
    const t=OP.resolveSelection(state.selectedId,currentTracks());
    if(!t){ card.innerHTML=`<div class="empty">${state.selectedId?state.selectedId+' is no longer reported.':'Select a contact on the map or in the list.'}</div>`; return; }
    const c=OP.closingSpeed(t,state.site), pc=OP.priorityClass(t.priority);
    card.innerHTML=`
      <div class="top"><span class="cid">${t.id}</span><span class="badge ${pc}">${t.priority}</span></div>
      <div class="reason">${t.reason||''}</div>
      <div class="facts">
        <div class="f"><div class="k">RANGE TO SITE</div><div class="v">${fmtRange(t.range_m)}</div></div>
        <div class="f"><div class="k">CLOSING SPEED</div><div class="v">${c>=0?'+':''}${c.toFixed(1)}<small>m/s</small></div></div>
        <div class="f"><div class="k">HEADING</div><div class="v">${String(compass(t.heading)).padStart(3,'0')}°<small>${t.speed.toFixed(0)} m/s</small></div></div>
        <div class="f"><div class="k">ALTITUDE</div><div class="v">${t.altitude_m==null?'—':t.altitude_m+'<small>m sim</small>'}</div></div>
        <div class="f"><div class="k">TRACK STATUS</div><div class="v ${t.status==='STALE'?pc:''}">${t.status}</div></div>
        <div class="f"><div class="k">LAST UPDATE</div><div class="v">${t.age_s.toFixed(1)}<small>s ago</small></div></div>
      </div>
      <div class="acts">
        <button id="act-focus" aria-pressed="${state.mode==='focus'}">FOCUS</button>
        <button id="act-follow" aria-pressed="${state.mode==='follow'}">FOLLOW</button>
      </div>
      <details><summary>Technical details</summary><div class="kv">position   x ${t.x.toFixed(0)}  y ${t.y.toFixed(0)}  (sim metres)
heading    ${t.heading.toFixed(1)}° math · ${compass(t.heading)}° compass
speed      ${t.speed.toFixed(1)} m/s
source     radar only · constant-velocity filter
identity   tracker-assigned, not ground truth</div></details>`;
    $('act-focus').addEventListener('click',()=>{ if(state.mode==='focus') overview(); else focusSelected(false); });
    $('act-follow').addEventListener('click',()=>{ if(state.mode==='follow') overview(); else focusSelected(true); });
  }

  function renderClock(){
    const f=state.playback.frame(), t=f?f.t:0, dur=Math.round((state.data&&state.data.duration_s)||90);
    $('clock').innerHTML=`T+${t.toFixed(1).padStart(4,'0')} <span class="of">/ ${dur} s</span>`;
  }
  function syncTransport(){
    const p=state.playback;
    $('play').disabled=p.playing||p.done||!p.total; $('pause').disabled=!p.playing;
  }

  function select(id){
    state.selectedId=id;
    if(state.mode==='focus'||state.mode==='follow') focusSelected(state.mode==='follow');
    render();
  }

  /* ---------------- input ---------------- */
  function bind(){
    $('play').addEventListener('click',start);
    $('pause').addEventListener('click',stop);
    $('reset').addEventListener('click',reset);
    $('speed').addEventListener('change',()=>{ if(state.playback.playing) start(); });
    $('scenario').addEventListener('change',e=>{ state.scenario=e.target.value; state.selectedId=null; load(); });
    for(const b of document.querySelectorAll('#count-seg button')){
      b.addEventListener('click',()=>{
        for(const o of document.querySelectorAll('#count-seg button')) o.setAttribute('aria-pressed','false');
        b.setAttribute('aria-pressed','true'); state.count=parseInt(b.dataset.n,10); state.selectedId=null; load();
      });
    }
    $('v-overview').addEventListener('click',overview);
    $('zoom-in').addEventListener('click',()=>{manual();state.camera=OP.zoomAt(state.camera,1.5,state.viewport.w/2,state.viewport.h/2,state.viewport);draw()});
    $('zoom-out').addEventListener('click',()=>{manual();state.camera=OP.zoomAt(state.camera,1/1.5,state.viewport.w/2,state.viewport.h/2,state.viewport);draw()});
    const map=$('map');
    map.addEventListener('wheel',ev=>{
      ev.preventDefault(); manual();
      const r=map.getBoundingClientRect(), f=Math.exp(-ev.deltaY*0.0018);
      state.camera=OP.zoomAt(state.camera,f,ev.clientX-r.left,ev.clientY-r.top,state.viewport); draw();
    },{passive:false});
    map.addEventListener('mousedown',ev=>{ if(ev.button!==0) return; state.drag={x:ev.clientX,y:ev.clientY,moved:false}; });
    window.addEventListener('mousemove',ev=>{
      if(!state.drag) return;
      const dx=ev.clientX-state.drag.x, dy=ev.clientY-state.drag.y;
      if(!state.drag.moved&&Math.hypot(dx,dy)<3) return;
      state.drag.moved=true; manual();
      state.camera={...state.camera,cx:state.camera.cx-dx/state.camera.scale,cy:state.camera.cy+dy/state.camera.scale};
      state.drag.x=ev.clientX; state.drag.y=ev.clientY; draw();
    });
    window.addEventListener('mouseup',()=>{ state.drag=null; });
    window.addEventListener('resize',()=>{ resizeViewport(); draw(); });
    $('viso-btn').addEventListener('click',()=>{ $('connections').hidden=false; refreshViso(); });
    $('close-connections').addEventListener('click',()=>{ $('connections').hidden=true; });
  }

  /* ---------------- Viso status (never driven by playback) ---------------- */
  async function refreshViso(){
    try{
      const r=await fetch('/api/preview/viso/status'); const v=await r.json();
      const st=(v.state||'UNKNOWN'), cls=st==='RECEIVING'?'ok':st==='NOT CONFIGURED'||st==='WAITING FOR DELIVERY'?'':st.includes('ERROR')?'bad':'warn';
      $('viso-btn').className='viso '+cls; $('viso-text').textContent='VISO · '+st;
      $('viso-pill').textContent=st;
      $('viso-kv').textContent=`state          ${st}
configured     ${v.configured}
webhook        ${v.webhook_path||'—'}
auth header    ${v.header_name||'—'}
last receipt   ${v.last_receipt_at||'none'}
last outcome   ${v.last_outcome||'—'}
deliveries     ${v.delivery_count??0}
${v.configured?'':'\nSet the shared secret to enable deliveries. Until then this source is inactive; the simulation above does not depend on it.'}`;
    }catch(e){ $('viso-text').textContent='VISO · UNAVAILABLE'; }
  }

  function init(){ bind(); requestAnimationFrame(tick); load(); refreshViso(); setInterval(refreshViso,8000); }
  init();
})();
</script>
</body>
</html>
