name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Verify generated schemas are current
        run: python scripts/export_schemas.py --check

      - name: Verify replay manifests and evidence artifacts
        run: python scripts/verify_replay_artifacts.py

      - name: Verify preserved frontend integrity
        run: python scripts/verify_frontend.py

      - name: Verify local data exclusions
        run: |
          for candidate_local_file in demo.db demo.db-wal demo.db.bak demo.sqlite demo.sqlite-wal demo.sqlite.bak demo.sqlite3 demo.sqlite3-shm demo.sqlite3.backup; do
            git check-ignore --quiet --no-index "$candidate_local_file"
          done

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run dashboard tests
        run: node --test tests/dashboard.test.cjs

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Check launcher shell syntax
        run: bash -n start-drive-copy.command
