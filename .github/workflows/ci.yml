name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run dashboard tests
        run: npm ci && npm test

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Test Android touch layouts and desktop
        env:
          DRONEWATCH_PYTHON: python
        run: npm run test:browser

      - name: Compile Python modules
        run: python -m compileall -q main.py demo_feed.py target_schema.py
